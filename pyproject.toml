[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "akash-deploy"
version = "0.0.6"
description = "Python bindings for Akash Network deployment and Console API proto types"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["python"]
module-name = "akash_deploy._native"
python-source = "python"
